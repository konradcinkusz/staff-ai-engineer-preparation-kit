# A secret committed once and removed in the next commit is still in the
# history and is still leaked. So the scan runs over the full history, on every
# push and pull request, and weekly in case a rule that did not exist last
# month exists now.

name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action annotates the pull request when it finds something.
      # Without this it can scan and cannot report, which is the half that
      # gets read.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, which is the point

      # Deliberately not pinned to a digest. A pinned scanner silently stops
      # detecting whatever upstream added last month, which is the one kind of
      # dependency where staying current matters more than reproducibility.
      - name: gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required on a pull_request event -- the action resolves the PR's
          # commit range through the API. Without it the run fails with
          # "GITHUB_TOKEN is now required to scan pull requests" and never
          # scans at all, which is the worst way for a scanner to fail:
          # a red check that looks like a finding and is a configuration
          # error. That is exactly how this was found.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Distinguished on purpose. A tooling failure and a finding are different
      # events needing different actions, and the first version of this printed
      # "a secret may be in the history" over a missing-token error -- telling
      # the reader to rotate a credential that was never leaked.
      #
      # The output name and the codes are read out of the action rather than
      # guessed. The first attempt at this guessed `exitcode` and `== 1`, and
      # was wrong twice: the action declares no outputs in its action.yml but
      # calls setOutput("exit-code", ...) -- with a hyphen -- and its constants
      # are 0 no leaks, 1 GITLEAKS ERROR, 2 LEAKS DETECTED. So `1` is the code
      # for the tooling failure, and the guess had the two branches inverted.
      # It would not have errored; it would have told a reader with a genuine
      # leak that the scan had not run.
      #
      # An empty value means the action failed before gitleaks ran at all --
      # a missing token, a licence check -- so `!= '2'` covers that with the
      # error case, which is the same advice either way: read the log.
      #
      # Index syntax rather than a dot, because in the expression grammar a
      # hyphen is subtraction: `outputs.exit-code` parses as `outputs.exit`
      # minus `code`, evaluates without complaint, and is never '2'.
      - name: A secret is in the history
        if: failure() && steps.gitleaks.outputs['exit-code'] == '2'
        run: |
          {
            echo '## A secret is in the history'
            echo
            echo '**Rotate first, scrub second.** Rewriting history does not'
            echo 'un-leak a credential that was public for an hour. Rotating'
            echo 'does. Scrubbing without rotating is theatre.'
            echo
            echo 'If it is a false positive, add a narrow rule to'
            echo '`.gitleaks.toml` -- by file, never by directory.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The scanner itself failed
        if: failure() && steps.gitleaks.outputs['exit-code'] != '2'
        run: |
          {
            echo '## The scan did not run'
            echo
            echo 'This is a configuration or network failure, not a finding.'
            echo 'Nothing here says anything about whether a secret is in the'
            echo 'history -- the scanner did not get far enough to have an'
            echo 'opinion. Read the job log before concluding either way.'
          } >> "$GITHUB_STEP_SUMMARY"
